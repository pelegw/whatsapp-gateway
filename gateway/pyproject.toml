[project]
name = "wa-gw-gateway"
version = "0.1.0"
description = "Policy-enforcing WhatsApp gateway for AI agents (REST + MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=1.9,<2",           # official MCP SDK (not the third-party 'fastmcp' package)
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "pyjwt[crypto]>=2.8,<3", # verify Cloudflare Access identity JWTs (RS256)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
